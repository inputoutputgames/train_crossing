<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Crossing</title>
    <style>
        body {
            display: flex;
            margin: 0;
        }

        div {
            background-color: black;
            height: 100vh;
            width: 50vw;
        }

        .on {
            background-color: red;
        }
    </style>
</head>

<body>
    <div id="left"></div>
    <div id="right"></div>
</body>
<script>
    let running = false;
    let flasher = null;

    const left = document.getElementById("left");
    const right = document.getElementById("right");

    const sound = new Audio("bell.mp3");
    sound.loop = true;

    document.addEventListener("click", () => {
        if (!running) {
            sound.play();
            start();
        } else {
            sound.pause();
            sound.currentTime = 0;
            stop();
        }
    });

    function start() {
        running = true;
        left.classList.add("on");
        flasher = setInterval(toggle, 500);
    }

    function stop() {
        running = false;
        clearInterval(flasher);
        flasher = null;
        right.classList.remove("on");
        left.classList.remove("on");
    }

    function toggle() {
        if (!running) return;

        if (left.classList.contains("on")) {
            right.classList.add("on");
            left.classList.remove("on");
        } else {
            right.classList.remove("on");
            left.classList.add("on");
        }
    }
</script>

</html>
